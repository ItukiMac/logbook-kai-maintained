name: Pinned Maven 3.9.11
description: Download the fixed Apache Maven distribution and verify its pinned SHA512
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        install_dir=$(mktemp -d "$RUNNER_TEMP/logbook-maven-3.9.11.XXXXXX")
        curl --fail --silent --show-error --location --retry 3 --connect-timeout 20 --max-time 180 \
          https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.11/apache-maven-3.9.11-bin.tar.gz \
          --output "$install_dir/maven.tar.gz"
        echo 'bcfe4fe305c962ace56ac7b5fc7a08b87d5abd8b7e89027ab251069faebee516b0ded8961445d6d91ec1985dfe30f8153268843c89aa392733d1a3ec956c9978  '"$install_dir/maven.tar.gz" | sha512sum --check --strict
        tar -xzf "$install_dir/maven.tar.gz" -C "$install_dir"
        echo "$install_dir/apache-maven-3.9.11/bin" >> "$GITHUB_PATH"
