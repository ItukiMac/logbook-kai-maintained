name: Product conventions and parallel delivery
on: [push, pull_request]
permissions:
  contents: read
jobs:
  conventions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: ./.github/actions/pinned-maven
      - run: mvn --batch-mode --no-transfer-progress formatter:validate dependency:build-classpath -DincludeScope=runtime -Dmdep.outputFile=target/runtime-classpath.txt
      - run: python3 scripts/check_runtime_notices.py
      - run: python3 scripts/check_product_conventions.py
      - run: node --test scripts/tests/parallel_bridge.test.cjs
      - run: python3 -m unittest discover -s scripts/tests -p test_retained_data_import.py
