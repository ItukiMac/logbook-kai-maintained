name: R10 exact-source runtime-copy verification (tooling only)
on:
  push:
    branches: ['maintenance/r10-checked-worker-20261027']
permissions:
  contents: write
concurrency:
  group: r10-checked-worker-20261027
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'ItukiMac/logbook-kai-maintained'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE: 51702c5f1db806ccf62a011b7b2f27a478f557b1
      TARGET: maintenance/r10-runtime-snapshot-20261027
      EXPECTED_TREE: 890c87d8aa158119b5a2a85a9534482bc0911a25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: payload
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          path: candidate
          ref: 51702c5f1db806ccf62a011b7b2f27a478f557b1
          persist-credentials: true
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: candidate/pom.xml
      - name: Verify exact ten-file patch and complete candidate tree in a fresh checkout
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE"
          test -z "$(git status --porcelain)"
          test "$(git ls-remote origin refs/heads/$TARGET | cut -f1)" = "$BASE"
          python3 - <<'PY'
          import base64,hashlib,json,lzma,os,subprocess
          from pathlib import Path,PurePosixPath
          encoded=''.join((Path('../payload/.maintenance-transfers/r10')/f'part{i}.txt').read_text() for i in range(3))
          assert len(encoded)==21696
          assert hashlib.sha256(encoded.encode()).hexdigest()=='e7541cd0a31a6356fc7870c46102d2041d8cf396c1a1cb1ab39a3a3d968cd71c'
          dec=lzma.LZMADecompressor(memlimit=128*1024*1024)
          raw=dec.decompress(base64.b64decode(encoded,validate=True),max_length=100001)
          assert len(raw)==57189 and dec.eof and not dec.unused_data
          spec=json.loads(raw)
          assert spec['base']==os.environ['BASE'] and len(spec['files'])==10 and spec['tree']==os.environ['EXPECTED_TREE']
          output={};h=hashlib.sha256()
          for item in spec['files']:
              name=item['path'];p=Path(name);rel=PurePosixPath(name)
              assert not rel.is_absolute() and '..' not in rel.parts and '\\' not in name
              assert name not in output and rel.parts[0] in ('src','scripts','docs')
              assert not any(q.is_symlink() for q in (p,*p.parents))
              if item['old_sha256'] is None:
                  assert not p.exists()
                  data=item['text'].encode('utf-8')
              else:
                  assert p.is_file() and hashlib.sha256(p.read_bytes()).hexdigest()==item['old_sha256']
                  text=p.read_bytes().decode('utf-8');start,end,replacement=item['edit']
                  assert 0<=start<=end<=len(text)
                  data=(text[:start]+replacement+text[end:]).encode('utf-8')
                  assert hashlib.sha256(data).hexdigest()==item['new_sha256']
              output[name]=data;h.update(name.encode()+b'\0'+data+b'\0')
          assert h.hexdigest()==spec['aggregate_sha256']=='0c7bd8f2cb878320e49b6349082927d484d06aca4af6dde9b0dd77c4807fa348'
          for name,data in output.items():
              p=Path(name);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
          subprocess.run(['git','add','--',*output],check=True)
          assert set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())==set(output)
          assert subprocess.check_output(['git','write-tree'],text=True).strip()==os.environ['EXPECTED_TREE']
          Path('../verified-paths.json').write_text(json.dumps(list(output)))
          print('VERIFIED_TEN_FILE_TREE',os.environ['EXPECTED_TREE'])
          PY
          git -c core.whitespace=cr-at-eol diff --cached --check
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0t64
      - name: Full GUI, arrival roundtrip, existing split lifecycle and rule tests
        working-directory: candidate
        run: bash scripts/verify_r3.sh
      - name: Commit tested source only and non-force push the dedicated branch
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/$TARGET | cut -f1)" = "$BASE"
          python3 - <<'PY'
          import hashlib,json,os,subprocess,xml.etree.ElementTree as E
          from pathlib import Path
          paths=json.loads(Path('../verified-paths.json').read_text());h=hashlib.sha256()
          for name in paths:h.update(name.encode()+b'\0'+Path(name).read_bytes()+b'\0')
          assert h.hexdigest()=='0c7bd8f2cb878320e49b6349082927d484d06aca4af6dde9b0dd77c4807fa348'
          assert subprocess.check_output(['git','write-tree'],text=True).strip()==os.environ['EXPECTED_TREE']
          subprocess.run(['git','diff','--exit-code'],check=True)
          suites=[E.parse(p).getroot() for p in Path('target/surefire-reports').glob('TEST-*.xml')]
          totals={k:sum(int(s.get(k,0)) for s in suites) for k in ('tests','failures','errors','skipped')}
          assert totals=={'tests':480,'failures':0,'errors':0,'skipped':1},totals
          logs=Path('target/r3-verification')
          assert 'Ran 154 tests' in (logs/'python-scripts.log').read_text()
          assert 'Ran 25 tests' in (logs/'python-tools.log').read_text()
          print('R10_FULL_COUNTS',totals,'Python154+25')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'R10: snapshot and restore runtime bytes only to new roots; verify arrival records and correct quest257 destroyer upper bound'
          git push origin "HEAD:refs/heads/$TARGET"
          git rev-parse HEAD > target/r3-verification/source-commit.txt
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: r10-checked-source-evidence
          path: |
            candidate/target/r3-verification/*.json
            candidate/target/r3-verification/*.log
            candidate/target/r3-verification/*.txt
            candidate/target/surefire-reports/
          retention-days: 14
          if-no-files-found: error
