name: PR65 combined final evidence (tooling only)
on:
  push:
    branches: ['maintenance/pr65-final-audit-20261028']
    paths: ['.github/workflows/pr65-final-evidence.yml']
permissions:
  actions: read
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check retained failed attempt and final exact-head test evidence without executing artifacts
        run: |
          mkdir -p .maintenance-evidence
          python3 - <<'PY'
          import hashlib,io,json,os,re,time,urllib.request,zipfile,xml.etree.ElementTree as E
          from pathlib import Path,PurePosixPath
          api='https://api.github.com/repos/ItukiMac/logbook-kai-maintained'
          head='d0c48c37d683079e33f30e4cfbf36d4f8bf6c742'
          expected_tree='d12e75884e9a9f2ef7d09b467c18f45ecb697229'
          out=Path('.maintenance-evidence/pr65-final-'+os.environ['GITHUB_RUN_ID']+'.json')
          report={'head':head,'source_tree':expected_tree,'verified':False,'product_changes':False,
                  'artifact_code_executed':False,'production_accessed':False,'runs':[],'artifacts':[]}
          def save():out.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          def get(path,limit=8*1024*1024):
              req=urllib.request.Request(api+path,headers={'Accept':'application/vnd.github+json'})
              req.add_unredirected_header('Authorization','Bearer '+os.environ['GH_TOKEN'])
              with urllib.request.urlopen(req,timeout=60) as response:raw=response.read(limit+1)
              assert len(raw)<=limit,'Response limit exceeded'
              return raw
          def obj(path):return json.loads(get(path))
          trees={}
          def tree(sha):
              assert re.fullmatch('[a-f0-9]{40}',sha)
              if sha not in trees:trees[sha]=obj('/git/commits/'+sha)['tree']['sha']
              return trees[sha]
          def archive(artifact):
              assert not artifact['expired'] and artifact['size_in_bytes']<=8*1024*1024
              raw=get('/actions/artifacts/'+str(artifact['id'])+'/zip')
              digest='sha256:'+hashlib.sha256(raw).hexdigest()
              assert digest==artifact['digest'],'Digest mismatch'
              z=zipfile.ZipFile(io.BytesIO(raw));infos=z.infolist()
              assert len(infos)==len({i.filename for i in infos}) and sum(i.file_size for i in infos)<=80*1024*1024
              for i in infos:
                  p=PurePosixPath(i.filename)
                  assert not p.is_absolute() and '..' not in p.parts and '\\' not in i.filename
              assert z.testzip() is None,'CRC failure'
              return z,digest
          def outer_counts(text):
              matched=re.findall(r'^Ran (\d+) tests? in [^\n]*\n\s*\n?OK(?: \(skipped=(\d+)\))?\s*$',text,re.M)
              assert matched and not re.search(r'^FAILED \(',text,re.M),'Missing successful complete summary'
              all_counts=[{'discovered':int(n),'skipped':int(k or 0),'successful':int(n)-int(k or 0)} for n,k in matched]
              outer=max(all_counts,key=lambda x:x['discovered'])
              assert sum(x['discovered']==outer['discovered'] for x in all_counts)==1,'Ambiguous outer suite'
              return {'outer':outer,'all_complete_summaries':all_counts}
          try:
              assert tree(head)==expected_tree
              # Preserve the original failure independently of the rerun artifact name.
              failed=obj('/actions/artifacts/12823926092')
              assert failed['digest']=='sha256:924a922427cdcc65b895b07f2d12cf858d1c1c6b45db4e22f581259490d21b65'
              z,digest=archive(failed)
              names=[n for n in z.namelist() if n.endswith('runtime-migration.log')];assert len(names)==1
              old=z.read(names[0]).decode('utf8')
              assert 'java.util.concurrent.TimeoutException' in old and 'RuntimeMigrationProbe.java:225' in old
              assert '"originals_unchanged": true' in old and '"external_write_events": []' in old
              assert 'FAILED (failures=1)' in old
              failure_path=Path('.maintenance-evidence/pr65-first-java21-migration-failure.log')
              assert not failure_path.exists();failure_path.write_text(old,encoding='utf8')
              report['initial_failure']={'run':40703778913,'job':122870303484,'artifact':failed['id'],'digest':digest,
                  'kind':'two-second FX readiness FutureTask timeout','originals_unchanged':True,
                  'external_write_events':[],'persistent_cause_fixed':False,'retained_log':str(failure_path)}
              save()
              required={40703778936,40703779015,40703778894,40703779116,40703779042,40703778833,
                        40703778848,40703778855,40703778831,40703778987,40703778784,40703778913,
                        40703779077,40703778818,40703778786}
              for attempt in range(32):
                  runs=obj('/actions/runs?event=pull_request&head_sha='+head+'&per_page=100')['workflow_runs']
                  assert required.issubset({r['id'] for r in runs}) and all(r['head_sha']==head for r in runs)
                  report['runs']=[{k:r[k] for k in ('id','name','head_sha','status','conclusion','run_attempt')} for r in runs];save()
                  if all(r['status']=='completed' for r in runs):break
                  time.sleep(15)
              assert all(r['status']=='completed' and r['conclusion']=='success' for r in runs),report['runs']
              selected={40703778786:{'r3-evidence-java21','r3-evidence-java25'},
                        40703779077:{'modern-runtime-evidence-java25'},
                        40703778913:{'runtime-migration-java21','runtime-migration-java25'}}
              found=set()
              for runid,names in selected.items():
                  artifacts=obj('/actions/runs/'+str(runid)+'/artifacts?per_page=100')['artifacts']
                  for name in names:
                      candidates=[a for a in artifacts if a['name']==name and not a['expired']]
                      assert candidates,('Missing artifact',runid,name)
                      a=max(candidates,key=lambda x:(x['created_at'],x['id']))
                      assert a['workflow_run']['head_sha']==head and a['workflow_run']['id']==runid
                      z,digest=archive(a)
                      row={'id':a['id'],'name':name,'run':runid,'digest':digest,'java':{},'focused_java':{},
                           'python':{},'checkouts':[],'proofs':{},'skipped_java':[]}
                      summaries=[]
                      for filename in z.namelist():
                          if filename.endswith('.xml') and '/TEST-' in '/'+filename:
                              raw=z.read(filename);assert b'<!DOCTYPE' not in raw.upper()
                              suite=E.fromstring(raw);values={k:int(suite.get(k,0)) for k in ('tests','failures','errors','skipped')}
                              for k,v in values.items():row['java'][k]=row['java'].get(k,0)+v
                              suite_name=suite.get('name','')
                              if values['skipped']:row['skipped_java'].append(suite_name)
                              if suite_name in {'logbook.core.AirBaseStatusContractTest','logbook.internal.gui.AirBaseStatusBoundaryTest','logbook.core.QuestListReadContractTest'}:
                                  row['focused_java'][suite_name]=values
                          elif filename.endswith('.json') and z.getinfo(filename).file_size<120000:
                              value=json.loads(z.read(filename))
                              if isinstance(value,dict) and 'airbase_status' in value and 'quest_list_read' in value and 'java_tests' in value:
                                  summaries.append(value)
                              if isinstance(value,dict) and 'jdk_baseline' in value and 'javafx' in value:
                                  row['modern_runtime']=value
                          elif filename.endswith(('python-scripts.log','python-tools.log')):
                              row['python'][filename.split('/')[-1]]=outer_counts(z.read(filename).decode('utf8'))
                          elif filename.endswith('runtime-migration.log'):
                              text=z.read(filename).decode('utf8');row['migration_counts']=outer_counts(text)['outer']
                              row['migration_markers']=[line for line in text.splitlines() if line.startswith(('MIGRATION_CURRENT_SPLIT_PREFLIGHT_OK','RUNTIME_MIGRATION_DECLARED_VERSIONS_OK','RUNTIME_MIGRATION_JAVA_OK','RUNTIME_MIGRATION_TEST_SUMMARY'))]
                          elif filename.endswith('checkout.txt'):
                              sha=z.read(filename).decode().strip();assert tree(sha)==expected_tree;row['checkouts'].append(sha)
                      if name.startswith('runtime-migration'):
                          assert row['migration_counts']=={'discovered':5,'skipped':0,'successful':5}
                          assert any('RUNTIME_MIGRATION_DECLARED_VERSIONS_OK' in l and 'real_launcher=true' in l for l in row['migration_markers'])
                          assert any('source_unchanged=true' in l and 'external_unchanged=true' in l for l in row['migration_markers'])
                      else:
                          assert row['java']['failures']==row['java']['errors']==0 and row['java']['skipped']==1
                          assert row['skipped_java']==['logbook.core.PublicDataReleaseIntegrationTest']
                          expected_suites={'logbook.core.AirBaseStatusContractTest':21,'logbook.internal.gui.AirBaseStatusBoundaryTest':2,'logbook.core.QuestListReadContractTest':17}
                          assert set(row['focused_java'])==set(expected_suites)
                          for key,count in expected_suites.items():assert row['focused_java'][key]==dict(tests=count,failures=0,errors=0,skipped=0)
                          assert len(summaries)==1;summary=summaries[0];assert summary['java_tests']==row['java']
                          assert tree(summary['checkout'])==expected_tree
                          if summary['checkout'] not in row['checkouts']:row['checkouts'].append(summary['checkout'])
                          air=summary['airbase_status'];quest=summary['quest_list_read']
                          assert air['result']=='passed' and air['captured_power']==40 and air['refresh_power']==60
                          assert all(air[k] for k in ('product_status_jar','frozen_selection','identity_preserved','sorted_planes','unknown_visible','stale_values_cleared','legacy_export','timeline_stopped','original_history_unchanged','source_jar_unchanged'))
                          assert not air['production_accessed']
                          assert quest['result']=='passed' and all(quest[k] for k in ('cached_custom_preserved','persisted_files_unchanged','hash_collision_refresh','observed_at_preserved','active_custom_inactive_order','unchanged_rows_reused','visibility_refresh','product_distribution'))
                          assert not quest['production_accessed'] and not quest['explicit_remove_executed']
                          assert summary['parallel_integration']['calculations']==[10,15,10] and summary['parallel_integration']['original_unchanged']
                          assert summary['seasonal_retreat_integration_tests']==8 and summary['isolated_typed_definitions']==152
                          assert summary['ship_list_ui']['result']=='passed' and summary['equipment_ui_packaging']['result']=='passed' and summary['record_ui_packaging']['result']=='passed'
                          row['proofs']={k:summary[k] for k in ('airbase_status','quest_list_read','parallel_integration','seasonal_retreat_integration_tests','isolated_typed_definitions')}
                          assert set(row['python'])=={'python-scripts.log','python-tools.log'}
                          assert row['python']['python-scripts.log']['outer']['discovered']>400 and row['python']['python-scripts.log']['outer']['skipped']==1
                          assert row['python']['python-tools.log']['outer']==dict(discovered=25,skipped=0,successful=25)
                          if name.startswith('modern'):assert row['modern_runtime']['jdk_baseline']==25 and row['modern_runtime']['javafx']=='27.0.1'
                      report['artifacts'].append(row);found.add(name);save()
              assert found==set().union(*selected.values())
              pr=obj('/pulls/65');assert pr['head']['sha']==head
              report['pr_state']={k:pr[k] for k in ('state','draft','merged','merge_commit_sha')}
              report['master_at_inspection']=obj('/git/ref/heads/master')['object']['sha']
              report['verified']=True;save()
              print('PR65_COMBINED_EVIDENCE_OK',head,len(report['artifacts']),len(runs))
          except Exception as error:
              report['error']=type(error).__name__+': '+str(error);save();raise
          PY
      - name: Preserve inspection report and original failed attempt without product or master updates
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .maintenance-evidence/pr65-*
          git commit -m 'Retain PR65 exact-head combined verification and original FX timeout evidence'
          git push origin HEAD:refs/heads/maintenance/pr65-final-audit-20261028
