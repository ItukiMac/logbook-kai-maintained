name: Isolated source proposal verification (no merge or deploy)
on:
  pull_request:
    paths:
      - 'scripts/maintenance_source_candidate.py'
      - 'scripts/maintenance_workbench.py'
      - 'scripts/tests/test_maintenance_source_candidate.py'
      - '.github/workflows/maintenance-source-candidate.yml'
      - '.github/actions/pinned-maven/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21.0.13+9'
          cache: maven
      - uses: ./.github/actions/pinned-maven
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0t64
      - name: Checkpoint, stage a real test proposal and run fixed Python and Java GUI checks in the new checkout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/source-candidate-evidence
          python3 - <<'PY' > target/source-candidate-evidence/verification.log 2>&1
          import hashlib,json,os,sys,tempfile,xml.etree.ElementTree as E
          from pathlib import Path
          sys.path.insert(0,str(Path('scripts').resolve()))
          import maintenance_workbench as w
          import maintenance_source_candidate as c
          original=Path.cwd()
          before={n:w.digest(w.read_source(original,n)) for n in w.tracked(original)}
          base=Path(tempfile.mkdtemp(prefix='source-candidate-',dir=os.environ['RUNNER_TEMP']))
          r=w.checkpoint(original,base/'checkpoint',progress={'task':'M3','phase':'isolated-verification','next':'report only'},toolchain=w.measure_environment())
          changes=[{'path':'scripts/tests/test_staged_source_inventory.py','expected_old_sha256':None,
            'content':"import unittest\nfrom pathlib import Path\nfrom maintenance_inventory import collect\nimport maintenance_workbench as w\n\nclass StagedInventoryTest(unittest.TestCase):\n    def test_restored_inventory_scope(self):\n        root=Path(__file__).resolve().parents[2]\n        result=collect(root,list(w.tracked(root)))\n        self.assertEqual(152,result['counts']['game_json'])\n        self.assertEqual(0,result['counts']['skipped'])\n"}]
          receipt=c.stage(base/'checkpoint',r['checkpoint_sha256'],changes,base/'candidate',protected=[original])
          result=c.verify_candidate(base/'candidate',receipt,isolated_runner=True)
          suites=[E.parse(p).getroot() for p in (base/'candidate/target/surefire-reports').glob('TEST-*.xml')]
          totals={k:sum(int(s.get(k,0)) for s in suites) for k in ('tests','failures','errors','skipped')}
          assert totals['tests']>=1000 and totals['failures']==totals['errors']==0
          for name in ['PublicAutoCompletionGuiTest','QuestObservationUiBindingGuiTest']:
              matches=[s for s in suites if s.get('name','').endswith('.'+name)]
              assert len(matches)==1 and int(matches[0].get('tests',0))>0 and int(matches[0].get('skipped',0))==0,name
          assert before=={n:w.digest(w.read_source(original,n)) for n in w.tracked(original)}
          result.update(checkout=os.environ['GITHUB_SHA'],totals=totals,source_unchanged=True,production_accessed=False)
          Path('target/source-candidate-evidence/summary.json').write_text(json.dumps(result,indent=2)+'\n')
          print('SOURCE_CANDIDATE_VERIFIED '+json.dumps(result))
          PY
          tail -8 target/source-candidate-evidence/verification.log
          git diff --exit-code
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: isolated-source-candidate-evidence
          path: target/source-candidate-evidence/
          retention-days: 14
          if-no-files-found: error
