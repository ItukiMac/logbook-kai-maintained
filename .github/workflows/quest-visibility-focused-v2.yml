name: Quest visibility identity-corrected verification (tooling only)
on:
  push:
    branches: ['maintenance/quest-visibility-worker-20261029']
    paths: ['.github/workflows/quest-visibility-focused-v2.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE: b87d0139d3c25db63ab29035df4762d80b55a92e
      TARGET: maintenance/quest-visibility-20261029
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: tooling
      - uses: actions/checkout@v7.0.1
        with:
          ref: b87d0139d3c25db63ab29035df4762d80b55a92e
          path: candidate
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: candidate/pom.xml
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0t64 libxtst6
      - name: Prepare unchanged fixture data with ID-based row lookup
        working-directory: candidate
        run: |
          set -eu
          mkdir ../evidence
          test "$(git rev-parse HEAD)" = "$BASE"
          test ! -e scripts/java/QuestVisibilityProbe.java
          test ! -e scripts/tests/test_quest_visibility_ui.py
          cp ../tooling/.maintenance-tools/QuestVisibilityProbe.java scripts/java/QuestVisibilityProbe.java
          cp ../tooling/.maintenance-tools/test_quest_visibility_ui.py scripts/tests/test_quest_visibility_ui.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/java/QuestVisibilityProbe.java');s=p.read_text()
          old='for(var row:rows(box))if(((Hyperlink)field(row,"name")).getText().equals("retained custom"))return row;'
          new='for(var row:rows(box)){Object value=field(row,"display");if(Integer.valueOf(10001).equals(value.getClass().getMethod("no").invoke(value)))return row;}'
          assert s.count(old)==1;s=s.replace(old,new)
          p.write_text(s)
          PY
          mvn -B -ntp -DskipTests package > ../evidence/baseline-package.log 2>&1
      - name: Same original-preservation assertion must fail on the unchanged base
        working-directory: candidate
        shell: bash
        run: |
          set +e
          python3 -m unittest discover -s scripts/tests -p test_quest_visibility_ui.py -v > ../evidence/before.log 2>&1
          rc=$?
          set -e
          test "$rc" -ne 0
          grep 'QUEST_REMOVE_LOST_ORIGINAL custom_file_and_cached_quest_must_be_retained' ../evidence/before.log
      - name: Apply source and execute all focused command and boundary cases
        working-directory: candidate
        run: |
          python3 ../tooling/.maintenance-tools/quest_visibility.py > ../evidence/apply.log 2>&1
          git -c core.whitespace=cr-at-eol diff --check
          mvn -B -ntp -Dtest=QuestVisibilityCommandTest,QuestVisibilityBoundaryTest test > ../evidence/unit.log 2>&1
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as E
          suites=[E.parse(p).getroot() for p in Path('target/surefire-reports').glob('TEST-*QuestVisibility*.xml')]
          totals={key:sum(int(s.get(key,0)) for s in suites) for key in ('tests','failures','errors','skipped')}
          assert len(suites)==2 and totals=={'tests':23,'failures':0,'errors':0,'skipped':0},totals
          PY
          mvn -B -ntp -DskipTests package > ../evidence/package.log 2>&1
      - name: Require actual modal confirmations, all-hidden recovery and unchanged original data
        working-directory: candidate
        run: python3 -m unittest discover -s scripts/tests -p test_quest_visibility_ui.py -v > ../evidence/after.log 2>&1
      - name: Reuse the unchanged mandatory-gate and documentation additions
        working-directory: candidate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,textwrap
          source=Path('../tooling/.github/workflows/quest-visibility-focused.yml').read_text()
          start=source.index('      - name: Preserve previous verification and require new command and GUI checks\n')
          end=source.index('      - name: Commit tested product files',start)
          body=textwrap.dedent(source[start:end].split('        run: |\n',1)[1])
          assert body.startswith("python3 - <<'PY'\n") and 'quest_visibility' in body
          p=Path('../evidence/retained-finalize.sh');p.write_text(body)
          subprocess.run(['bash','-eu',str(p)],check=True)
          PY
      - name: Preserve tested source without replacing master or prior histories
        working-directory: candidate
        run: |
          set -eu
          test "$(git ls-remote origin refs/heads/$TARGET | cut -f1)" = "$BASE"
          git -c core.whitespace=cr-at-eol diff --check
          git add src/main/java/logbook/plugin/api/QuestVisibilityV1.java src/main/java/logbook/core/QuestVisibilityService.java src/main/java/logbook/internal/gui/QuestVisibilityUi.java src/main/java/logbook/internal/gui/QuestPane.java src/main/java/logbook/internal/gui/MainController.java src/main/resources/logbook/gui/quest.fxml src/test/java/logbook/core/QuestVisibilityCommandTest.java src/test/java/logbook/internal/gui/QuestVisibilityBoundaryTest.java scripts/java/QuestVisibilityProbe.java scripts/tests/test_quest_visibility_ui.py scripts/verify_r3.sh docs/maintenance/quest-visibility-20261029.md
          test "$(git diff --cached --name-only | wc -l)" -eq 12
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Replace destructive quest removal with confirmed reversible session visibility commands'
          git push origin "HEAD:refs/heads/$TARGET"
          git rev-parse HEAD > ../evidence/source-commit.txt
          git rev-parse HEAD^{tree} > ../evidence/source-tree.txt
      - name: Keep this outcome and the original failed fixture attempt
        if: always()
        working-directory: tooling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,textwrap
          source=Path('.github/workflows/quest-visibility-focused.yml').read_text()
          start=source.index('      - name: Retain exact outcomes including any failure outside product source\n')
          end=source.index('      - uses: actions/upload-artifact',start)
          body=textwrap.dedent(source[start:end].split('        run: |\n',1)[1])
          assert body.startswith('mkdir -p .maintenance-evidence\n')
          p=Path('../evidence/retained-evidence.sh');p.write_text(body)
          subprocess.run(['bash','-eu',str(p)],check=True)
          PY
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: quest-visibility-focused-v2-evidence
          path: |
            evidence/
            candidate/target/surefire-reports/
            candidate/target/r3-verification/quest-visibility-fixture-*
          retention-days: 14
