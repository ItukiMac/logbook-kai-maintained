name: Quest document commands before-after (tooling only)
on:
  push:
    branches: ['maintenance/quest-document-worker-20261029']
    paths: ['.github/workflows/quest-document-focused.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE: 7ff88aaf96b8316386f38ac338826263706cc33c
      TARGET: maintenance/quest-document-commands-20261029
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: tooling
      - uses: actions/checkout@v7.0.1
        with:
          ref: 7ff88aaf96b8316386f38ac338826263706cc33c
          path: candidate
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: candidate/pom.xml
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0t64 libxtst6
      - name: Prove current GUI directly depends on the store and owns shared validation
        working-directory: candidate
        shell: bash
        run: |
          set -eu
          mkdir ../evidence
          test "$(git rev-parse HEAD)" = "$BASE"
          python3 ../tooling/.maintenance-tools/quest_document_tests.py baseline
          set +e
          mvn -B -ntp -Dtest=QuestDocumentCommandsBoundaryTest test > ../evidence/before.log 2>&1
          result=$?
          set -e
          test "$result" -ne 0
          python3 - <<'PY'
          import xml.etree.ElementTree as E,json
          from pathlib import Path
          s=E.parse('target/surefire-reports/TEST-logbook.internal.gui.QuestDocumentCommandsBoundaryTest.xml').getroot()
          assert {k:int(s.get(k,0)) for k in ('tests','failures','errors','skipped')}=={'tests':2,'failures':2,'errors':0,'skipped':0},s.attrib
          Path('../evidence/before.json').write_text(json.dumps({'expected_boundary_failures':s.attrib,'source_mutations':False}))
          PY
      - name: Apply bounded source extraction and new synthetic test suites
        working-directory: candidate
        run: |
          python3 ../tooling/.maintenance-tools/apply_quest_documents.py > ../evidence/apply.log 2>&1
          python3 - <<'PY'
          from pathlib import Path
          s=Path('../tooling/.maintenance-tools/quest_document_tests.py').read_text()
          prefix=s[:s.index("new('src/test/java/logbook/internal/gui/QuestDocumentCommandsBoundaryTest.java'")]
          tail=s.split("if sys.argv[1]=='baseline':raise SystemExit(0)",1)[1]
          exec(compile(prefix+tail,'authored-new-tests','exec'))
          PY
          git -c core.whitespace=cr-at-eol diff --check
      - name: Execute new commands and real dialogs plus all arrival-editor regressions
        working-directory: candidate
        run: |
          xvfb-run -a mvn -B -ntp -Dlogbook.gui.tests=true -Dtest=QuestDocumentCommandsTest,QuestDocumentCommandsBoundaryTest,QuestDocumentCommandsGuiTest,ArrivalConditionEditorGuiTest test > ../evidence/after.log 2>&1
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as E,json
          expected={'logbook.core.QuestDocumentCommandsTest':28,'logbook.internal.gui.QuestDocumentCommandsBoundaryTest':2,'logbook.internal.gui.QuestDocumentCommandsGuiTest':5,'logbook.internal.gui.ArrivalConditionEditorGuiTest':12}
          result={}
          for name,n in expected.items():
              r=E.parse(Path('target/surefire-reports')/('TEST-'+name+'.xml')).getroot()
              value={k:int(r.get(k,0)) for k in ('tests','failures','errors','skipped')}
              assert value=={'tests':n,'failures':0,'errors':0,'skipped':0},(name,value)
              result[name]=value
          Path('../evidence/after.json').write_text(json.dumps(result,indent=2))
          PY
          mvn -B -ntp -DskipTests package > ../evidence/package.log 2>&1
      - name: Retain all existing mandatory gates and add new executed GUI/command requirement
        working-directory: candidate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/verify_r3.sh');s=p.read_text()
          old="report={'quest_visibility':quest_visibility"
          assert s.count(old)==1
          addition="""# Bound document commands must execute alongside the existing editor and store regressions.
          document_suites=[s for s in suites if s.get('name') in {'logbook.core.QuestDocumentCommandsTest','logbook.internal.gui.QuestDocumentCommandsBoundaryTest','logbook.internal.gui.QuestDocumentCommandsGuiTest'}]
          assert len(document_suites)==3 and all(int(s.get(k,0))==0 for s in document_suites for k in ('failures','errors','skipped'))
          document_test_count=sum(int(s.get('tests',0)) for s in document_suites)
          assert document_test_count>=35
          document_gui=[s for s in document_suites if s.get('name')=='logbook.internal.gui.QuestDocumentCommandsGuiTest']
          assert len(document_gui)==1 and int(document_gui[0].get('tests',0))>=5
          """
          s=s.replace(old,addition+"report={'quest_document_command_tests':document_test_count,'quest_document_gui_tests':int(document_gui[0].get('tests',0)),'quest_visibility':quest_visibility")
          p.write_text(s)
          doc=Path('docs/maintenance/quest-document-commands-20261029.md');assert not doc.exists()
          doc.write_text('''# 任務編集の保存・退避コマンド境界 — 2026-10-29

          基点はPR67統合7ff88aaf96b8316386f38ac338826263706cc33c。
          QuestDocumentsV1は承認済みディレクトリと任務IDから編集Sessionを開く。
          公開型に可変bean・Jacksonツリー・JavaFXを含めず、読込時の生バイトは防御コピーする。
          Sessionは読込時の対象ID・パス・内容へ固定され、Planは発行Sessionと世代へ結び付く。
          別Session・古いPlanは拒否し、キャンセルではファイルを確認・変更しない。
          confirmedは呼出し契約であり、ユーザー本人認証や第三者プラグインの権限制御ではない。

          ## 再利用した処理
          QuestDocumentStoreのソースは変更しない。既存の厳密なバイト比較、リンク拒否、サイズ上限、
          別名バックアップ検証、新規ファイルの非上書き作成、原子的置換・退避と失敗証拠保持を再利用する。
          既存QuestEditorDocumentのパーサー/validate本体をQuestDocumentValidationへ移し、GUI側は互換ファサードとした。
          重複キー・余剰JSON・到達条件・艦隊指定の規則を弱めず、別実装を増やさない。
          部分編集と未知条件/コメント保持のmergeは従来どおり。完全な任務仕様認証ではない。

          ## 画面
          既存questDirectoryテスト用差替えとsaveDocument/removeDocumentのpackage-local呼出しは保持する。
          読込時に対象をSessionへ固定し、保存時に選択IDと一致しなければ拒否する。
          退避は対象パス・読込時SHA256・原本とコピーの保持・枠解放・履歴非変更を実確認画面へ示す。
          確認中にファイルや選択対象が変わった場合は適用しない。成功後だけフォームを初期化する。
          退避済みの内容は従来の.before-remove-/.removed-ファイルに保持される。完全削除はしない。
          PR67の一覧非表示とは別操作である。一覧非表示は枠を空けず、定義退避は有効名を外して枠を空ける。

          ## 検証
          同じclassfile境界試験2件が変更前に失敗し、変更後に成功することを確認する。
          合成TempDirだけを用いたコマンド28件、境界2件、実FXML/モーダルGUI5件を追加する。
          新規/無変更/変更保存、原本保持、確認取消、古い操作・別Session拒否、競合、未知項目、
          シンボリックリンク、上限、欠損、カスタム範囲、退避後状態を検証する。
          実GUIは保存と元コピー、退避取消、確認成功、確認中の外部変更、対象切替を検証する。
          既存の港到達編集GUI12件も個別に併行実行する。最終CI/版/成果物はPRへ記録し、未実行を合格としない。

          ## 未完了の範囲
          任務編集の物理JAR化、任務Selector/フォーム/読取サービスの完全分離、同名ファイル変更監視、
          工廠設定、全writer同期、その他P1/P3、全148任務意味照合、未知保存形式、Issues移管、実機/公開は残る。
          既存Storeには外部の非協調writerとの検査直後の競合を完全に排除するOS横断保証はない。
          本APIのSession整合性を全アプリ/全ファイルシステムの原子性やセキュリティ境界と取り違えない。
          正当な明示編集の出力内容は呼出側が生成する。任意の未知条件を自動復元する機構ではない。

          ## 安全境界
          ソースと隔離CIのみ。試験は新規合成領域であり、Mint/現用JAR/auto.sh/本人データ/履歴/バックアップへ触れない。
          原本削除、forcepush、Release/タグ公開、有料AI/API実行、KQS別repo変更なし。
          ローカルコンテナ起動は失敗しており、実行証拠はGitHub runnerのもの。
          '''.replace('          ',''),encoding='utf8')
          PY
          test "$(git hash-object src/main/java/logbook/internal/util/QuestDocumentStore.java)" = 2482dd2bc0002af9cd14d3ef9ff9b23472211944
      - name: Preserve tested product files on dedicated source branch only
        working-directory: candidate
        run: |
          set -eu
          test "$(git ls-remote origin refs/heads/$TARGET | cut -f1)" = "$BASE"
          git -c core.whitespace=cr-at-eol diff --check
          git add src/main/java/logbook/plugin/api/QuestDocumentsV1.java src/main/java/logbook/core/QuestDocumentService.java src/main/java/logbook/core/QuestDocumentValidation.java src/main/java/logbook/internal/gui/QuestEditorDocument.java src/main/java/logbook/internal/gui/QuestConditionEditController.java src/test/java/logbook/core/QuestDocumentCommandsTest.java src/test/java/logbook/internal/gui/QuestDocumentCommandsBoundaryTest.java src/test/java/logbook/internal/gui/QuestDocumentCommandsGuiTest.java scripts/verify_r3.sh docs/maintenance/quest-document-commands-20261029.md
          test "$(git diff --cached --name-only | wc -l)" -eq 10
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Bind quest editor saves and retirement to public captured-document commands with explicit confirmation'
          git push origin "HEAD:refs/heads/$TARGET"
          git rev-parse HEAD > ../evidence/head.txt
          git rev-parse HEAD^{tree} > ../evidence/tree.txt
      - name: Retain exact successful or failed evidence outside product source
        if: always()
        working-directory: tooling
        run: |
          mkdir -p .maintenance-evidence
          python3 - <<'PY'
          from pathlib import Path
          import json,os,xml.etree.ElementTree as E
          report={'base':'7ff88aaf96b8316386f38ac338826263706cc33c','production_accessed':False,'full_ci_verified':False,'files':{},'suites':[]}
          for p in Path('../evidence').glob('*'):
              if p.suffix=='.json':report['files'][p.name]=json.loads(p.read_text())
              elif p.suffix in ('.log','.txt'):
                  lines=p.read_text(errors='replace').splitlines();report['files'][p.name]={'tail':lines[-100:],'errors':[line for line in lines if '[ERROR]' in line][-40:]}
          for p in Path('../candidate/target/surefire-reports').glob('TEST-*QuestDocumentCommands*.xml'):
              report['suites'].append(E.parse(p).getroot().attrib)
          Path('.maintenance-evidence/quest-documents-focused-'+os.environ['GITHUB_RUN_ID']+'.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .maintenance-evidence/quest-documents-focused-*.json
          git commit -m 'Retain actual focused quest-document outcome including original failing boundary'
          git push origin HEAD:refs/heads/maintenance/quest-document-worker-20261029
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: quest-document-focused-evidence
          path: |
            evidence/
            candidate/target/surefire-reports/
          retention-days: 14
