name: Offline game-data install integration (Java 21)

on:
  pull_request:
    paths:
      - '.github/actions/pinned-maven/**'
      - 'src/main/java/logbook/core/**'
      - 'src/test/java/logbook/core/**'
      - 'tools/build_data_pack.py'
      - '.github/workflows/data-installer-integration.yml'
      - 'src/main/resources/logbook/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21.0.13+9'
          cache: maven
      - uses: ./.github/actions/pinned-maven
      - name: Package ALL bundled game definitions (no network publish)
        run: python3 tools/build_data_pack.py --source-sha "$GITHUB_SHA"
      - name: Install and read the real pack via Java, including negative tests
        run: |
          mvn --batch-mode --no-transfer-progress \
            -Dlogbook.test.dataPackPath=target/logbook-data-pack.zip \
            verify
      - name: Preserve test diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: data-install-integration-reports
          path: '**/target/surefire-reports/**'
          if-no-files-found: ignore
          retention-days: 14
