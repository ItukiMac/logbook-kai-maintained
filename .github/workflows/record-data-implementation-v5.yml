name: Complete focused record-module verification (tooling only)
on:
  push:
    branches: ['maintenance/record-data-worker-20261028']
    paths: ['.github/workflows/record-data-implementation-v5.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE: eb0bf6a0fa56d35877f332536551361a5de7b996
      TARGET: maintenance/record-data-api-20261028
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: tooling
      - uses: actions/checkout@v7.0.1
        with:
          ref: eb0bf6a0fa56d35877f332536551361a5de7b996
          path: candidate
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: candidate/pom.xml
      - name: Prepare exact source without touching production or private data
        working-directory: candidate
        run: |
          mkdir -p ../evidence
          test "$(git rev-parse HEAD)" = "$BASE"
          test -z "$(git status --porcelain)"
          python3 ../tooling/.maintenance-tools/prepare_record_candidate.py > ../evidence/prepare.log 2>&1
          git -c core.whitespace=cr-at-eol diff --check
      - name: Compile and execute API/data tests
        working-directory: candidate
        run: |
          mvn -B -ntp -Dtest=RecordDataContractTest,RecordDataViewTest,RecordUiBoundaryTest,RecordUiContractTest test > ../evidence/unit.log 2>&1
          mvn -B -ntp -DskipTests package > ../evidence/package.log 2>&1
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0t64 libxtst6
      - name: Run independent package checks and real GUI proof; require all results
        working-directory: candidate
        shell: bash
        run: |
          set +e
          python3 -m unittest discover -s scripts/tests -p test_record_distribution_profile.py -v > ../evidence/profile-tests.log 2>&1 & p1=$!
          python3 -m unittest discover -s scripts/tests -p test_feature_distribution.py -v > ../evidence/legacy-profile-tests.log 2>&1 & p2=$!
          python3 -m unittest discover -s scripts/tests -p test_record_ui_integration.py -v > ../evidence/gui.log 2>&1 & p3=$!
          wait "$p1"; r1=$?
          wait "$p2"; r2=$?
          wait "$p3"; r3=$?
          printf '{"profile":%s,"legacy_profile":%s,"gui":%s}\n' "$r1" "$r2" "$r3" > ../evidence/result-codes.json
          test "$r1" -eq 0 -a "$r2" -eq 0 -a "$r3" -eq 0
      - name: Commit tested candidate only; preserve master and all old histories
        working-directory: candidate
        run: |
          test "$(git ls-remote origin refs/heads/$TARGET | cut -f1)" = "$BASE"
          python3 - <<'PY'
          from pathlib import Path
          import json,subprocess
          paths=json.loads(Path('../evidence/product-paths.json').read_text())
          subprocess.run(['git','add','--',*paths],check=True)
          assert set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())==set(paths)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Ship immutable record views through charts with compatible old bundle handling and explicit unknown history'
          git push origin "HEAD:refs/heads/$TARGET"
          git rev-parse HEAD > ../evidence/source-commit.txt
      - name: Retain every focused result, including failures, separately from product source
        if: always()
        working-directory: tooling
        run: |
          mkdir -p .maintenance-evidence
          python3 - <<'PY'
          from pathlib import Path
          import json,xml.etree.ElementTree as E
          result={'base':'eb0bf6a0fa56d35877f332536551361a5de7b996','production_accessed':False,'full_regression_verified':False,'logs':{},'suites':[],'gui_reports':{}}
          for p in Path('../evidence').glob('*'):
              if p.suffix=='.json':result[p.name]=json.loads(p.read_text())
              else:
                  text=p.read_text(errors='replace');result['logs'][p.name]={'tail':text[-22000:],'errors':[line for line in text.splitlines() if '[ERROR]' in line][-60:]}
          for p in Path('../candidate/target/surefire-reports').glob('TEST-*Record*.xml'):
              result['suites'].append(E.parse(p).getroot().attrib)
          for p in Path('../candidate/target/r3-verification').glob('record-ui-*.json'):
              result['gui_reports'][p.name]=json.loads(p.read_text())
          Path('.maintenance-evidence/record-data-build-v5.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .maintenance-evidence/record-data-build-v5.json
          git commit -m 'Retain complete focused record module evidence without overwriting earlier attempts'
          git push origin HEAD:refs/heads/maintenance/record-data-worker-20261028
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: record-data-build-v5-evidence
          path: |
            evidence/
            candidate/target/surefire-reports/
            candidate/target/r3-verification/record-ui-*.json
            candidate/target/r3-verification/record-ui-*.log
          retention-days: 14
