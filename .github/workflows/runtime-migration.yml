name: Runtime migration declared versions (no publish)

on:
  pull_request:
    paths:
      - '.github/actions/pinned-maven/**'
      - 'scripts/**'
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/runtime-migration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration:
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          ref: a094771d73ce420f2bd2ddf237e0c69cf2005067
          path: fixtures/old
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          ref: 06be3c9dd4137efbffa5d4f91800881dbc07a5ff
          path: fixtures/new
          persist-credentials: false
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '${{ matrix.java }}'
          cache: maven
      - uses: ./candidate/.github/actions/pinned-maven
      - name: Install display dependencies in the disposable CI runner
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0t64 libxtst6
      - name: Build candidate and the two unchanged declared application revisions
        shell: bash
        run: |
          set -euo pipefail
          for directory in candidate fixtures/old fixtures/new; do
            (cd "$directory" && mvn --batch-mode --no-transfer-progress -DskipTests package)
          done
          python3 - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          revisions = {'old': 'a094771d73ce420f2bd2ddf237e0c69cf2005067',
                       'new': '06be3c9dd4137efbffa5d4f91800881dbc07a5ff'}
          for label, expected in revisions.items():
              root = Path('fixtures') / label
              actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], cwd=root, text=True).strip()
              assert actual == expected, (label, actual)
              subprocess.run(['git', 'diff', '--exit-code'], cwd=root, check=True)
              jar = root / 'target/logbook-kai.jar'
              with jar.open('rb') as stream:
                  checksum = hashlib.file_digest(stream, 'sha256').hexdigest()
              report = {'source_commit': actual, 'jar_sha256': checksum,
                        'tracked_source_unchanged': True, 'synthetic_user_data_only': True}
              (jar.parent / 'source-provenance.json').write_text(json.dumps(report, indent=2))
          PY
      - name: Require real Launcher, historical JAR pair and full state recovery on this JDK
        working-directory: candidate
        shell: bash
        env:
          LOGBOOK_MIGRATION_OLD_JAR: '${{ github.workspace }}/fixtures/old/target/logbook-kai.jar'
          LOGBOOK_MIGRATION_NEW_JAR: '${{ github.workspace }}/fixtures/new/target/logbook-kai.jar'
        run: |
          set -euo pipefail
          mkdir -p target/verification
          xvfb-run -a python3 - <<'PY' 2>&1 | tee target/verification/runtime-migration.log
          import json, unittest
          suite = unittest.defaultTestLoader.loadTestsFromName('scripts.tests.test_runtime_migration_java')
          discovered = suite.countTestCases()
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          summary = {'discovered': discovered, 'executed': result.testsRun,
                     'successful': result.testsRun - len(result.failures) - len(result.errors) - len(result.skipped),
                     'failures': len(result.failures), 'errors': len(result.errors), 'skipped': len(result.skipped),
                     'native_mint_tested': False, 'production_applied': False}
          print('RUNTIME_MIGRATION_TEST_SUMMARY', json.dumps(summary))
          assert discovered >= 5 and result.testsRun == discovered
          assert result.wasSuccessful() and not result.skipped, summary
          PY
          grep 'RUNTIME_MIGRATION_DECLARED_VERSIONS_OK.*real_launcher=true' target/verification/runtime-migration.log
          grep 'real_launcher=true' target/verification/runtime-migration.log
          git diff --exit-code
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: runtime-migration-java${{ matrix.java }}
          path: |
            candidate/target/verification/runtime-migration.log
            fixtures/old/target/source-provenance.json
            fixtures/new/target/source-provenance.json
          if-no-files-found: error
          retention-days: 14
