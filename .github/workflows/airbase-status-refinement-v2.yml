name: Airbase final focused verification (tooling only)
on:
  push:
    branches: ['maintenance/airbase-status-worker-20261028']
    paths: ['.github/workflows/airbase-status-refinement-v2.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE: 80aba9b641dfe911bbe430e0cbf122e4548fc489
      TARGET: maintenance/airbase-status-api-20261028
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: tooling
      - uses: actions/checkout@v7.0.1
        with:
          ref: 80aba9b641dfe911bbe430e0cbf122e4548fc489
          path: candidate
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: candidate/pom.xml
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0t64 libxtst6
      - name: Correct checked-exception declarations in test lifecycle only
        working-directory: candidate
        run: |
          mkdir -p ../evidence
          python3 ../tooling/.maintenance-tools/airbase_selection_refine.py > ../evidence/apply.log 2>&1
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/test/java/logbook/core/AirBaseStatusContractTest.java');s=p.read_text()
          for name in ('initResourceReader','closeResourceReader'):
              old='static void '+name+'() {';assert s.count(old)==1;s=s.replace(old,'static void '+name+'() throws Exception {')
          p.write_text(s)
          PY
          git -c core.whitespace=cr-at-eol diff --check
          mvn -B -ntp -Dtest=AirBaseStatusContractTest,AirBaseStatusBoundaryTest test > ../evidence/unit.log 2>&1
          mvn -B -ntp -DskipTests package > ../evidence/package.log 2>&1
          python3 -m unittest discover -s scripts/tests -p test_airbase_status_ui.py -v > ../evidence/gui.log 2>&1
      - name: Preserve verified refinement without force or publication
        working-directory: candidate
        run: |
          test "$(git ls-remote origin refs/heads/$TARGET | cut -f1)" = "$BASE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/logbook/internal/gui/AirBaseController.java src/test/java/logbook/core/AirBaseStatusContractTest.java scripts/java/AirBaseStatusGuiProbe.java scripts/verify_r3.sh
          git commit -m 'Keep base and group selection across refresh; verify existing recon calculations with proper resource lifecycle'
          git push origin "HEAD:refs/heads/$TARGET"
          git rev-parse HEAD > ../evidence/source-commit.txt
      - name: Retain outcome without removing initial failure evidence
        if: always()
        working-directory: tooling
        run: |
          python3 - <<'PY'
          import json,os,xml.etree.ElementTree as E
          from pathlib import Path
          r={'base':os.environ['BASE'],'production_accessed':False,'logs':{},'suites':[],'reports':{}}
          for p in Path('../evidence').glob('*'):
              if p.suffix in ('.log','.txt'):r['logs'][p.name]=p.read_text(errors='replace')[-14000:]
          for p in Path('../candidate/target/surefire-reports').glob('TEST-*AirBaseStatus*.xml'):r['suites'].append(E.parse(p).getroot().attrib)
          for p in Path('../candidate/target/r3-verification').glob('airbase-status-fixture-*'):
              if p.suffix=='.json':r['reports'][p.name]=json.loads(p.read_text())
              elif p.suffix=='.log':r['logs'][p.name]=p.read_text(errors='replace')[-18000:]
          Path('.maintenance-evidence','airbase-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT']+'.json').write_text(json.dumps(r,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .maintenance-evidence/airbase-*.json
          git commit -m 'Retain corrected focused airbase outcome; previous failed compile remains recorded'
          git push origin HEAD:refs/heads/maintenance/airbase-status-worker-20261028
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: airbase-final-focused-evidence
          path: |
            evidence/
            candidate/target/r3-verification/airbase-status-fixture-*
            candidate/target/surefire-reports/TEST-*AirBaseStatus*.xml
          retention-days: 14
