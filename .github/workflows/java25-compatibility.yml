name: Java 25 application compatibility (headless)

on:
  pull_request:
    paths:
      - 'pom.xml'
      - 'src/**'
      - '.github/workflows/java25-compatibility.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: java25-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java25:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Record runtime and Maven version
        run: |
          java -version
          mvn -version
      - name: Compile target Java 21 classes and run all non-GUI JUnit tests on JDK 25
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Preserve failure/success reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java25-surefire-reports
          path: '**/target/surefire-reports/**'
          if-no-files-found: ignore
          retention-days: 14
