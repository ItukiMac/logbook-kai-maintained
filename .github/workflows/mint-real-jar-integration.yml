name: Linux updater official-JAR to maintained-JAR integration

on:
  pull_request:
    paths:
      - 'dist-includes/helpers/apply-staged-update.py'
      - 'pom.xml'
      - 'src/**'
      - '.github/workflows/mint-real-jar-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mint-real-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build maintained application JAR
        run: |
          mvn --batch-mode --no-transfer-progress -DskipTests package
          test -s target/logbook-kai.jar
      - name: Compare official 25.0.8 JAR with local built JAR and test offline activation and restore
        shell: bash
        run: |
          set -euo pipefail
          TEMP="$(mktemp -d)"
          trap 'rm -rf "$TEMP"' EXIT
          mkdir -p "$TEMP/original" "$TEMP/app/update" "$TEMP/app/plugins" "$TEMP/app/config"
          curl --fail --location --retry 3 --silent --show-error \
            -o "$TEMP/original.zip" \
            https://github.com/sakura0689/logbook-kai/releases/download/v25.0.8/logbook-kai_25.0.8.zip
          echo 'd24b2aba8658b1acc6f4081604ce4280091cc714519ada957f9eaa6d240943c5  '"$TEMP/original.zip" | sha256sum --check --status
          unzip -q "$TEMP/original.zip" -d "$TEMP/original"
          OFFICIAL_JAR="$(find "$TEMP/original" -type f -name logbook-kai.jar -print -quit)"
          test -n "$OFFICIAL_JAR"
          cp "$OFFICIAL_JAR" "$TEMP/app/logbook-kai.jar"
          cp target/logbook-kai.jar "$TEMP/app/update/logbook-kai.jar"
          printf 'keep user settings' > "$TEMP/app/config/existing.cfg"
          printf 'keep KLB plugin' > "$TEMP/app/plugins/klb-logbook-plugin.jar"
          printf 'keep KQS plugin' > "$TEMP/app/plugins/kqs-logbook-plugin.jar"

          BEFORE="$(sha256sum "$TEMP/app/logbook-kai.jar" | cut -d ' ' -f1)"
          AFTER="$(sha256sum "$TEMP/app/update/logbook-kai.jar" | cut -d ' ' -f1)"
          test "$BEFORE" != "$AFTER"

          python3 dist-includes/helpers/apply-staged-update.py --root "$TEMP/app" --dry-run
          test "$(sha256sum "$TEMP/app/logbook-kai.jar" | cut -d ' ' -f1)" = "$BEFORE"
          python3 dist-includes/helpers/apply-staged-update.py --root "$TEMP/app"
          test "$(sha256sum "$TEMP/app/logbook-kai.jar" | cut -d ' ' -f1)" = "$AFTER"
          test ! -e "$TEMP/app/update/logbook-kai.jar"

          BACKUP="$(find "$TEMP/app/launcher-backups/app-versions" -type f -name 'logbook-kai-*.jar' -print -quit)"
          test -n "$BACKUP"
          test "$(sha256sum "$BACKUP" | cut -d ' ' -f1)" = "$BEFORE"

          python3 dist-includes/helpers/apply-staged-update.py \
            --root "$TEMP/app" --restore-backup "$BACKUP" --dry-run
          python3 dist-includes/helpers/apply-staged-update.py \
            --root "$TEMP/app" --restore-backup "$BACKUP"
          test "$(sha256sum "$TEMP/app/logbook-kai.jar" | cut -d ' ' -f1)" = "$BEFORE"
          test "$(cat "$TEMP/app/config/existing.cfg")" = 'keep user settings'
          test "$(cat "$TEMP/app/plugins/klb-logbook-plugin.jar")" = 'keep KLB plugin'
          test "$(cat "$TEMP/app/plugins/kqs-logbook-plugin.jar")" = 'keep KQS plugin'
          echo "PASSED: official-to-maintained JAR update, checked backup, explicit restore, no config/plugin file changes."
