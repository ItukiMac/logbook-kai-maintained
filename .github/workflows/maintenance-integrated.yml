name: Integrated maintenance verification (no publish)
on:
  pull_request:
    paths:
      - 'pom.xml'
      - 'src/**'
      - 'scripts/**'
      - 'tools/**'
      - '.github/workflows/**'
      - 'docs/maintenance/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '${{ matrix.java }}'
          cache: maven
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0t64
      - name: Generate the complete real game data pack in the isolated runner
        run: python3 tools/build_data_pack.py --source-sha "$GITHUB_SHA"
      - name: All Java tests including real GUI and game pack, without dynamic agent attachment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/verification
          xvfb-run -a mvn --batch-mode --no-transfer-progress -DargLine=-XX:-EnableDynamicAgentLoading -Dlogbook.gui.tests=true -Dlogbook.test.dataPackPath=target/logbook-data-pack.zip verify > target/verification/maven.log 2>&1 || { tail -120 target/verification/maven.log; exit 1; }
          grep 'Tests run:' target/verification/maven.log | tail -5
          grep -E 'SNAPSHOT_REAL_|real quest conditions' target/verification/maven.log || true
          ! grep -E 'Mockito is currently self-attaching|A Java agent has been loaded dynamically|No SLF4J providers were found' target/verification/maven.log
      - name: Python safety tests and fresh full game-data audit
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/tests -p 'test_*.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
          python3 scripts/maintenance_inventory.py --root . > target/verification/inventory.json
          if test -f scripts/audit_game_json.py; then
            python3 scripts/audit_game_json.py --root . > target/verification/game-json-audit.json
          fi
          git diff --exit-code -- src scripts tools pom.xml
      - name: Verify assembled runtime and summarize actually executed tests
        shell: bash
        run: |
          set -euo pipefail
          java -cp target/logbook-kai.jar:target/test-classes logbook.internal.logger.PackagedLoggingProbe
          python3 - <<'PY'
          import json, os, xml.etree.ElementTree as ET
          from pathlib import Path
          suites = [ET.parse(p).getroot() for p in Path('target/surefire-reports').glob('TEST-*.xml')]
          assert suites
          totals = {k: sum(int(s.get(k, 0)) for s in suites) for k in ('tests','failures','errors','skipped')}
          assert totals['failures'] == totals['errors'] == 0
          required = ['ProbabilityCalculatorBoundaryTest','ProxyFailureIsolationTest','PublicAutoCompletionGuiTest','RuntimeWiringTest','QuestDataDecoderCompatibilityTest','RealDefinitionPackIntegrationTest']
          # Follow-up snapshot integration tests become mandatory whenever present.
          for path in Path('src/test/java/logbook/core').glob('GameDefinition*Test.java'):
              required.append(path.stem)
          for name in required:
              matching = [s for s in suites if s.get('name','').endswith('.' + name)]
              assert len(matching) == 1 and int(matching[0].get('tests',0)) > 0 and int(matching[0].get('skipped',0)) == 0, name
          report = {'commit': os.environ['GITHUB_SHA'], 'totals': totals,
                    'executed_gui': True, 'executed_real_game_pack': True,
                    'dynamic_agent_loading': False, 'production_deployment': False}
          audit = Path('target/verification/game-json-audit.json')
          if audit.exists():
              data = json.loads(audit.read_text())
              assert data['complete'] and data['counts']['errors'] == 0
              report['game_json_audit'] = data['counts']
          Path('target/verification/summary.json').write_text(json.dumps(report, indent=2))
          print('INTEGRATED_TEST_SUMMARY', json.dumps(report))
          PY
          cp target/logbook-kai_25.0.10.zip target/verification/
          (cd target/verification && sha256sum logbook-kai_25.0.10.zip > SHA256SUMS)
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: integrated-candidate-java${{ matrix.java }}
          path: target/verification/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: integrated-test-reports-java${{ matrix.java }}
          path: target/surefire-reports/
          retention-days: 14
  artifact-roundtrip:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: integrated-candidate-java21
          path: verified
      - name: Check downloaded ZIP hash and archive integrity (never publish)
        working-directory: verified
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS
          python3 - <<'PY'
          import io, zipfile
          with zipfile.ZipFile('logbook-kai_25.0.10.zip') as archive:
              assert archive.testzip() is None
              with zipfile.ZipFile(io.BytesIO(archive.read('logbook-kai.jar'))) as jar:
                  assert jar.testzip() is None
                  provider = jar.read('META-INF/services/org.slf4j.spi.SLF4JServiceProvider').decode()
                  assert 'org.apache.logging.slf4j.SLF4JServiceProvider' in provider
          print('ARTIFACT_ROUNDTRIP_OK; no release/deployment performed')
          PY
