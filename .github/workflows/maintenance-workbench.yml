name: Source workbench checkpoint and new-environment recovery (no deploy)
on:
  pull_request:
    paths:
      - 'scripts/maintenance_workbench.py'
      - 'scripts/tests/test_maintenance_workbench.py'
      - 'docs/maintenance/maintenance-agent-contract.md'
      - '.github/workflows/maintenance-workbench.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21.0.13+9'
      - uses: ./.github/actions/pinned-maven
      - name: Require source protection, corruption refusal and exact tool preflight
        run: python3 -m unittest discover -s scripts/tests -p test_maintenance_workbench.py -v
      - name: Restore actual tracked source and resume its read-only validator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/workbench-evidence
          python3 - <<'PY'
          import hashlib,json,os,subprocess,tempfile
          from pathlib import Path
          import sys
          sys.path.insert(0,str(Path('scripts').resolve()))
          import maintenance_workbench as w
          source=Path.cwd()
          base=Path(tempfile.mkdtemp(prefix='workbench-recovery-',dir=os.environ['RUNNER_TEMP']))
          original={name:hashlib.sha256((source/name).read_bytes()).hexdigest() for name in w.tracked(source)}
          tools=w.measure_environment()
          receipt=w.checkpoint(source,base/'checkpoint',progress={
              'task':'M4','phase':'recovery-verification','next':'read-only source inventory',
              'pending':['native validation','publication'],'failed_attempts_retained':True},toolchain=tools)
          restored=w.restore(base/'checkpoint',receipt['checkpoint_sha256'],base/'new-environment',
              protected=[source],initialize_git=True)
          expected=w.verify(base/'checkpoint',receipt['checkpoint_sha256'])
          w.check_environment(expected,w.measure_environment())
          run=subprocess.run([sys.executable,'scripts/maintenance_inventory.py','--root','.'],
              cwd=base/'new-environment',capture_output=True,text=True,timeout=60,check=True)
          inventory=json.loads(run.stdout)
          assert inventory['counts']['skipped']==0 and inventory['counts']['game_json']==152
          assert original=={name:hashlib.sha256((source/name).read_bytes()).hexdigest() for name in w.tracked(source)}
          assert not restored['origin_history_copied'] and restored['initialized_new_git_history']
          report={'result':'passed','checkout':os.environ['GITHUB_SHA'],'files':receipt['files'],
              'toolchain':tools,'source_unchanged':True,'resumed_source_validator':True,
              'new_git_history':True,'paid_provider_calls':0,'production_accessed':False,
              'actual_os_snapshot_claimed':False,'checkpoint_sha256':receipt['checkpoint_sha256']}
          Path('target/workbench-evidence/summary.json').write_text(json.dumps(report,indent=2)+'\n')
          print('SOURCE_WORKBENCH_RECOVERY_OK '+json.dumps(report))
          PY
          git diff --exit-code
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: source-workbench-recovery-evidence
          path: target/workbench-evidence/
          retention-days: 14
          if-no-files-found: error
