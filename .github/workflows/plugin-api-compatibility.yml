name: KLB and KQS plugin API compatibility (Java 21)

on:
  pull_request:
    paths:
      - '.github/actions/pinned-maven/**'
      - 'src/main/**'
      - 'pom.xml'
      - 'assembly.xml'
      - '.github/workflows/plugin-api-compatibility.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-api-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout maintained host
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21.0.13+9'
          cache: maven
      - uses: ./.github/actions/pinned-maven
      - name: Build local host application without user settings
        run: |
          mvn --batch-mode --no-transfer-progress -DskipTests package
          test -s target/logbook-kai.jar
      - name: Build and verify the managed six-JAR distribution
        run: |
          python3 scripts/build_feature_distribution.py --jar target/logbook-kai.jar --out target/bundled-plugin-check --revision "$GITHUB_SHA"
          bash scripts/verify_bundled_plugins.sh target/bundled-plugin-check
