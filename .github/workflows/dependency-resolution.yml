name: Audited dependency resolution (no publish)
on:
  pull_request:
    paths:
      - '.github/actions/pinned-maven/**'
      - 'pom.xml'
      - '.github/workflows/dependency-resolution.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resolve:
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "${{ matrix.java == '21' && '21.0.13+9' || '25.0.5+8' }}"
          cache: maven
      - uses: ./.github/actions/pinned-maven
      - name: Record actual Maven resolution, not just version declarations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/dependency-verification
          mvn --batch-mode --no-transfer-progress help:effective-pom -Doutput=target/dependency-verification/effective-pom.xml
          mvn --batch-mode --no-transfer-progress dependency:tree -DoutputType=json -DoutputFile=target/dependency-verification/dependencies.json
          python3 - <<'PY'
          import json,os,xml.etree.ElementTree as E
          from pathlib import Path
          root=Path('target/dependency-verification'); rows={}
          def walk(node):
              for child in node.get('children',[]):
                  key=child['groupId']+':'+child['artifactId']
                  rows.setdefault(key,set()).add((child['version'],child.get('scope','')))
                  walk(child)
          walk(json.loads((root/'dependencies.json').read_text()))
          expected={'org.controlsfx:controlsfx':('11.2.6','compile'),
                    'org.slf4j:slf4j-api':('2.0.20','compile'),
                    'org.jspecify:jspecify':('1.0.1','test'),
                    'net.bytebuddy:byte-buddy':('1.18.16','test'),
                    'net.bytebuddy:byte-buddy-agent':('1.18.16','test'),
                    'org.objenesis:objenesis':('3.6','test'),
                    'tools.jackson.core:jackson-databind':('3.2.4','compile'),
                    'tools.jackson.core:jackson-core':('3.2.4','compile'),
                    'com.fasterxml.jackson.core:jackson-databind':('2.22.4','test'),
                    'com.fasterxml.jackson.core:jackson-core':('2.22.4','test')}
          for key,value in expected.items():
              assert rows.get(key)=={value},(key,rows.get(key),value)
          ns={'m':'http://maven.apache.org/POM/4.0.0'}
          pom=E.parse(root/'effective-pom.xml').getroot()
          plugins={p.findtext('m:artifactId',namespaces=ns):p.findtext('m:version',namespaces=ns)
                   for p in pom.findall('m:build/m:plugins/m:plugin',ns)}
          assert plugins['maven-surefire-plugin']=='3.6.1'
          pinned={'maven-clean-plugin': '3.5.0', 'maven-resources-plugin': '3.5.0', 'maven-jar-plugin': '3.5.1', 'maven-install-plugin': '3.2.0', 'maven-deploy-plugin': '3.2.0', 'maven-site-plugin': '3.22.0', 'maven-help-plugin': '3.5.2', 'maven-dependency-plugin': '3.11.0'}
          effective={p.findtext('m:artifactId',namespaces=ns):p.findtext('m:version',namespaces=ns)
                     for p in pom.findall('m:build/m:pluginManagement/m:plugins/m:plugin',ns)}
          for key,value in pinned.items():
              assert effective.get(key)==value,(key,effective.get(key),value)
          javafx={key:values for key,values in rows.items() if key.startswith('org.openjfx:')}
          assert len(javafx)==7 and all(version=='21.0.13' for values in javafx.values() for version,_ in values)
          assert pom.findtext('m:properties/m:java.version',namespaces=ns)=='21'
          report={'checkout':os.environ['GITHUB_SHA'],'resolved':{k:sorted(v) for k,v in rows.items()},
                  'plugins':plugins,'host_json':'Jackson3','legacy_plugin_json':'Jackson2 historical-fixture tests only',
                  'default_javafx21_retained':True,'production_deployed':False}
          (root/'summary.json').write_text(json.dumps(report,indent=2)+'\n')
          print('DEPENDENCY_RESOLUTION_OK Jackson3_host=true Jackson2_plugin_runtime=false JavaFX21_default=true')
          PY
          git diff --exit-code
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: dependency-resolution-java${{ matrix.java }}
          path: target/dependency-verification/
          if-no-files-found: error
          retention-days: 14
