name: Generation-scoped KQS and KLB compatibility (no publish)
on:
  pull_request:
    paths:
      - '.github/actions/pinned-maven/**'
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/generation-plugin-compatibility.yml'
      - 'docs/maintenance/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        java: ['21','25']
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          repository: ItukiMac/logbook-kai-maintained
          ref: 4f310942b231154d0d37d31d93a7a58f3793cf11
          path: .external/legacy-host
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          repository: ItukiMac/logbook-kai-maintained
          ref: 9dbe8e4871f885a99ba23bc24cfe8140afade93c
          path: .external/pre-arrival-host
          persist-credentials: false
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "${{ matrix.java == '21' && '21.0.13+9' || '25.0.5+8' }}"
          cache: maven
      - uses: ./.github/actions/pinned-maven
      - name: Build current and two pinned isolated prior host JARs
        run: |
          mvn --batch-mode --no-transfer-progress -DskipTests package
          mvn -f .external/legacy-host/pom.xml --batch-mode --no-transfer-progress -DskipTests package
          mvn -f .external/pre-arrival-host/pom.xml --batch-mode --no-transfer-progress -DskipTests package
      - name: Reject capability packs in the actual legacy host without changing its active data
        run: java -cp target/logbook-kai.jar:target/test-classes logbook.core.LegacyDefinitionPackProbe .external/legacy-host/target/logbook-kai.jar target/legacy-data-pack-proof
      - name: Prior V2-capable host rejects arrival semantics and retains active data
        run: java -cp target/logbook-kai.jar:target/test-classes logbook.core.PreArrivalHostProbe .external/pre-arrival-host/target/logbook-kai.jar target/pre-arrival-host-proof
      - name: Verify bundled KQS and KLB with the exact split host
        run: |
          python3 scripts/build_feature_distribution.py --jar target/logbook-kai.jar --out target/bundled-plugin-check --revision "$GITHUB_SHA"
          bash scripts/verify_bundled_plugins.sh target/bundled-plugin-check
