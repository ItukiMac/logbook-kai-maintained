name: Generation-scoped KQS and KLB compatibility (no publish)
on:
  pull_request:
    paths:
      - '.github/actions/pinned-maven/**'
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/generation-plugin-compatibility.yml'
      - 'docs/maintenance/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        java: ['21','25']
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          repository: ItukiMac/kancolle-quest-share
          ref: 319f8bee9eb5566b9fe5a026f55dc0df28594099
          path: .external/kqs-r2
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          repository: ItukiMac/kancolle-logbook-bridge
          ref: ba217f50dbd7f8b3ee8289a9ad6cbb430ee58979
          path: .external/klb
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          repository: ItukiMac/logbook-kai-maintained
          ref: 4f310942b231154d0d37d31d93a7a58f3793cf11
          path: .external/legacy-host
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          repository: ItukiMac/logbook-kai-maintained
          ref: 9dbe8e4871f885a99ba23bc24cfe8140afade93c
          path: .external/pre-arrival-host
          persist-credentials: false
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '${{ matrix.java }}'
          cache: maven
      - uses: ./.github/actions/pinned-maven
      - name: Build current and two pinned isolated prior host JARs
        run: |
          mvn --batch-mode --no-transfer-progress -DskipTests package
          mvn -f .external/legacy-host/pom.xml --batch-mode --no-transfer-progress -DskipTests package
          mvn -f .external/pre-arrival-host/pom.xml --batch-mode --no-transfer-progress -DskipTests package
      - name: Reject capability packs in the actual legacy host without changing its active data
        run: java -cp target/logbook-kai.jar:target/test-classes logbook.core.LegacyDefinitionPackProbe .external/legacy-host/target/logbook-kai.jar target/legacy-data-pack-proof
      - name: Prior V2-capable host rejects arrival semantics and retains active data
        run: java -cp target/logbook-kai.jar:target/test-classes logbook.core.PreArrivalHostProbe .external/pre-arrival-host/target/logbook-kai.jar target/pre-arrival-host-proof
      - name: Whole-export generation and observed-state contract against the current host
        working-directory: .external/kqs-r2
        env:
          LOGBOOK_JAR: ${{ github.workspace }}/target/logbook-kai.jar
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          bash scripts/build.sh
          bash scripts/test.sh | tee evidence/current-host.log
      - name: Same plugin binary explicitly falls back on the legacy host
        working-directory: .external/kqs-r2
        env:
          LOGBOOK_JAR: ${{ github.workspace }}/.external/legacy-host/target/logbook-kai.jar
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/test.sh | tee evidence/legacy-host.log
      - name: Compile the existing KLB implementation against the current host
        run: |
          mkdir -p target/klb-r2-compat
          javac --release 21 -proc:none -encoding UTF-8 -cp target/logbook-kai.jar -d target/klb-r2-compat .external/klb/plugin/src/local/kancolle/bridge/KancolleBridgeStartUp.java
          test -s target/klb-r2-compat/local/kancolle/bridge/KancolleBridgeStartUp.class
          echo 'Verified source compatibility only; no deployed binary or native Mint certification.'
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: generation-plugin-java${{ matrix.java }}
          path: .external/kqs-r2/evidence/
          retention-days: 14
