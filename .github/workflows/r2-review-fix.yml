name: R2 checked review-fix worker (not for master)
on:
  push:
    branches: ['maintenance/r2-review-fix-worker-20261026']
permissions:
  contents: write
concurrency:
  group: r2-review-fix-20261026
  cancel-in-progress: false
jobs:
  fix:
    if: github.repository == 'ItukiMac/logbook-kai-maintained'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE: 07016488cb76bbfdb8b63753f1c49170e5fdb779
      TARGET: maintenance/r2-consumers-capacity-state-20261026
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: payload
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          path: candidate
          ref: 07016488cb76bbfdb8b63753f1c49170e5fdb779
          persist-credentials: true
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: candidate/pom.xml
      - name: Apply five hash-checked review-fix files in the isolated checkout
        working-directory: candidate
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$BASE"
          test -z "$(git status --porcelain)"
          test "$(git ls-remote origin refs/heads/$TARGET | cut -f1)" = "$BASE"
          python3 - <<'PY'
          import base64,hashlib,json,lzma,os
          from pathlib import Path
          encoded=Path('../payload/.maintenance-transfers/r2/review-fix.txt').read_text()
          assert hashlib.sha256(encoded.encode()).hexdigest()=='61c1ad01d7ab0fe24ed29774dafc8b7f105a880ced476ddf6bbc6f478deea6e7'
          dec=lzma.LZMADecompressor(memlimit=64*1024*1024)
          raw=dec.decompress(base64.b64decode(encoded,validate=True),max_length=20001)
          assert len(raw)<=20000 and dec.eof and not dec.unused_data
          spec=json.loads(raw)
          allowed={'src/main/java/logbook/internal/gui/ItemItemController.java','src/main/java/logbook/internal/gui/RestoredCheckBoxGroup.java','src/test/java/logbook/internal/gui/RestoredCheckBoxGroupGuiTest.java','scripts/maintenance_plan.py','scripts/tests/test_maintenance_plan.py'}
          assert spec['base']==os.environ['BASE'] and len(spec['files'])==5 and {f['p'] for f in spec['files']}==allowed
          output={};h=hashlib.sha256()
          for item in spec['files']:
              p=Path(item['p']);assert not p.is_symlink()
              assert not p.exists() if item['a'] else p.is_file()
              lines=[] if item['a'] else p.read_bytes().decode().splitlines(True)
              end0=0
              for start,end,text in item['e']:assert end0<=start<=end<=len(lines);end0=end
              for start,end,text in reversed(item['e']):lines[start:end]=text.splitlines(True)
              data=''.join(lines).encode();output[str(p)]=data;h.update(str(p).encode()+b'\0'+data+b'\0')
          assert h.hexdigest()==spec['result_sha256']=='55dee9a3f372f0db7c323c18484f07572cc36f6303ef78065158ba75c7deaf52'
          for name,data in output.items():p=Path(name);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
          Path('../verified-paths.json').write_text(json.dumps(list(output)))
          PY
          git -c core.whitespace=cr-at-eol diff --check
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0t64
      - name: Verify all source including new GUI and resume regressions
        working-directory: candidate
        run: |
          set -eu
          mkdir -p target/review-fix-evidence
          python3 tools/build_data_pack.py --source-sha "$BASE"
          xvfb-run -a mvn --batch-mode --no-transfer-progress -Dlogbook.gui.tests=true -Dlogbook.test.dataPackPath=target/logbook-data-pack.zip verify > target/review-fix-evidence/maven.log 2>&1 || { tail -100 target/review-fix-evidence/maven.log; exit 1; }
          python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
          python3 -m unittest discover -s tools/tests -p 'test_*.py' -v
          python3 - <<'PY'
          import xml.etree.ElementTree as E
          from pathlib import Path
          ss=[E.parse(p).getroot() for p in Path('target/surefire-reports').glob('TEST-*.xml')]
          totals={k:sum(int(s.get(k,0)) for s in ss) for k in ('tests','failures','errors','skipped')}
          assert totals=={'tests':183,'failures':0,'errors':0,'skipped':1},totals
          assert all(int(s.get('skipped',0))==0 or s.get('name')=='logbook.core.PublicDataReleaseIntegrationTest' for s in ss)
          print('REVIEW_FIX_FULL_SUITE',totals)
          PY
      - name: Commit tested fixes and non-force push only the existing dedicated source branch
        working-directory: candidate
        run: |
          set -eu
          test "$(git ls-remote origin refs/heads/$TARGET | cut -f1)" = "$BASE"
          python3 - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          paths=json.loads(Path('../verified-paths.json').read_text());h=hashlib.sha256()
          for p in paths:h.update(p.encode()+b'\0'+Path(p).read_bytes()+b'\0')
          assert h.hexdigest()=='55dee9a3f372f0db7c323c18484f07572cc36f6303ef78065158ba75c7deaf52'
          subprocess.run(['git','add','--',*paths],check=True)
          assert set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())==set(paths)
          PY
          git -c core.whitespace=cr-at-eol diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'R2: restore category aggregate selection and invalidate resume evidence when estimates change'
          git push origin "HEAD:refs/heads/$TARGET"
          git rev-parse HEAD | tee target/review-fix-evidence/source-commit.txt
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: r2-review-fix-evidence
          path: |
            candidate/target/review-fix-evidence/
            candidate/target/surefire-reports/
          retention-days: 14
