name: Quest editor read corrected-fixture verification (tooling only)
on:
  push:
    branches: ['maintenance/quest-editor-read-worker-20261029']
    paths: ['.github/workflows/quest-editor-read-focused-v2.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE: 2aff776dc0112a36c65797dee7192a4a4d77f03e
      TARGET: maintenance/quest-editor-read-20261029
    steps:
      - uses: actions/checkout@v7.0.1
        with: {path: tooling}
      - uses: actions/checkout@v7.0.1
        with: {ref: 2aff776dc0112a36c65797dee7192a4a4d77f03e, path: candidate}
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: candidate/pom.xml
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0t64 libxtst6
      - name: Reuse exact production change and correct only the old test fixture input type
        working-directory: candidate
        run: |
          set -eu
          mkdir ../evidence
          test "$(git rev-parse HEAD)" = "$BASE"
          python3 ../tooling/.maintenance-tools/quest_editor_read.py baseline
          python3 ../tooling/.maintenance-tools/quest_editor_read_v2.py apply > ../evidence/apply.log 2>&1
          python3 ../tooling/.maintenance-tools/quest_editor_read_tests.py > ../evidence/add-tests.log 2>&1
          git -c core.whitespace=cr-at-eol diff --check
          git diff --exit-code -- src/main/java/logbook/core/QuestDocumentService.java src/main/java/logbook/core/QuestDocumentValidation.java src/main/java/logbook/internal/util/QuestDocumentStore.java src/main/java/logbook/internal/gui/QuestEditorDocument.java
      - name: Require all new pure and GUI cases and all retained arrival and command GUI regressions
        working-directory: candidate
        run: |
          xvfb-run -a mvn -B -ntp -Dlogbook.gui.tests=true -Dtest=QuestEditorReadTest,QuestEditorReadBoundaryTest,QuestEditorReadGuiTest,ArrivalConditionEditorGuiTest,QuestDocumentCommandsGuiTest test > ../evidence/after.log 2>&1
          python3 - <<'PY'
          import json,xml.etree.ElementTree as E
          from pathlib import Path
          names={'logbook.core.QuestEditorReadTest':26,'logbook.internal.gui.QuestEditorReadBoundaryTest':2,'logbook.internal.gui.QuestEditorReadGuiTest':6,'logbook.internal.gui.ArrivalConditionEditorGuiTest':12,'logbook.internal.gui.QuestDocumentCommandsGuiTest':7}
          result={}
          for name,n in names.items():
              r=E.parse('target/surefire-reports/TEST-'+name+'.xml').getroot()
              c={k:int(r.get(k,0)) for k in ('tests','failures','errors','skipped')}
              assert c==dict(tests=n,failures=0,errors=0,skipped=0),(name,c);result[name]=c
          Path('../evidence/suites.json').write_text(json.dumps(result,indent=2))
          PY
          mvn -B -ntp -DskipTests package > ../evidence/package.log 2>&1
      - name: Retain mandatory new-suite gates and document exact unfinished boundaries
        working-directory: candidate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/verify_r3.sh');s=p.read_text();needle="report={'quest_local_files':local_quests,"
          assert s.count(needle)==1
          extra="""# Editor inputs must use read-only projections while retaining existing write safeguards.
          editor_expected={'logbook.core.QuestEditorReadTest':26,'logbook.internal.gui.QuestEditorReadBoundaryTest':2,'logbook.internal.gui.QuestEditorReadGuiTest':6}
          editor_read_suites=[x for x in suites if x.get('name') in editor_expected]
          assert len(editor_read_suites)==3
          for x in editor_read_suites:
              assert int(x.get('tests',0))>=editor_expected[x.get('name')]
              assert all(int(x.get(k,0))==0 for k in ('failures','errors','skipped'))
          editor_read_count=sum(int(x.get('tests',0)) for x in editor_read_suites)
          """
          p.write_text(s.replace(needle,extra+"report={'quest_editor_read_tests':editor_read_count,'quest_editor_read_gui_tests':6,'quest_local_files':local_quests,"))
          p=Path('docs/maintenance/quest-editor-read-20261029.md');assert not p.exists()
          p.write_text('''# 任務編集の選択肢・入力フォーム読取境界 — 2026-10-29

          基点: PR69統合2aff776dc0112a36c65797dee7192a4a4d77f03e。
          QuestEditorDataV1は選択肢・入力既定値・艦種グループ・保存済みフォーム値を不変コピーで提供する。
          通常候補は従来のカテゴリ2/8/9/10かつ組込定義のない観測任務、カスタムは10001〜10005。
          既存QuestListV1と定義世代leaseを利用する。残存カスタムキャッシュは通常候補へ混在させない。
          画面は可変AppQuestを保持せず、元の観測が後で変わっても既に選択したID/タイトル/分類は変わらない。
          元キャッシュ、観測日時、保存期限、受諾状態の変更は行わない。

          保存済み入力は既存QuestDocumentValidationを用いる。重複/後続JSON、到達・艦隊番号・退避の検査を維持する。
          編集用の従来投影と同様、未知フィールドは表示型へ取り込まないが、元のraw bytes/JSONは保持する。
          Formは完全な保存文書ではない。未表示フィールドの保持は既存差分マージが担当する。
          フィルター・再帰編成・到達/戦闘行・入力語彙は不変コピーで、欠損値や期限を勝手に補わない。
          Store/DocumentService/Validation/EditorDocumentの内容、FXML、設定キー、保存形式、ゲーム条件/期限計算は無変更。

          ## 検証と保全
          同一2境界試験が基点で期待どおり失敗した証拠はworker40860423423に保存。
          初回は旧GUIテスト内の手動AppQuest生成の適合漏れで準備が停止した。新Choiceへ入力を置換し、アサーションは削除/緩和しない。
          新規26純粋契約+2境界+6実FXML=34件、既存到達12+保存/退避GUI7=19件を必須実行する。
          実FXMLで固定保存先、モード切替時の保存拒否、複合編成/到達入力、未知項目/元原本の保持を確認する。
          保存・退避を行う試験は新規合成TempDirだけを対象とする。全体CIの最終head・結果・成果物はPRを参照。

          ## 未完了
          任務UIの物理JAR化、進捗/条件編集コントロールの全ドメイン分離、工廠書込みAPI、全writer同期は残る。
          入力欄から保存候補を作るreadFormは既存型のまま。全編集モデルの分離や任意core版ABIを保証する変更ではない。
          候補の更新は既存タイミングを維持し、未保存フォームを自動リロードで捨てない。
          全148任務意味照合、未知形式移行、Issues無効での移管待ち、Mint/本人データ検証と公開も未完了として保持。
          全外部writerと完全に原子的な読取りを保証しない。
          Mint/OS/現用JAR/auto.sh/本人設定・履歴・plugins・backupsへアクセスせず、原本削除・forcepush・Release/タグ・有料AI/APIも実施しない。
          '''.replace('          ',''),encoding='utf8')
          PY
          git -c core.whitespace=cr-at-eol diff --check
      - name: Commit tested source only to the separate candidate branch, retaining history
        working-directory: candidate
        run: |
          set -eu
          test "$(git ls-remote origin refs/heads/$TARGET | cut -f1)" = "$BASE"
          git add src/main/java/logbook/plugin/api/QuestEditorDataV1.java src/main/java/logbook/core/QuestEditorReadService.java src/main/java/logbook/internal/gui/QuestConditionEditController.java src/test/java/logbook/core/QuestEditorReadTest.java src/test/java/logbook/internal/gui/QuestEditorReadBoundaryTest.java src/test/java/logbook/internal/gui/QuestEditorReadGuiTest.java src/test/java/logbook/internal/gui/ArrivalConditionEditorGuiTest.java src/test/java/logbook/internal/gui/QuestDocumentCommandsGuiTest.java scripts/verify_r3.sh docs/maintenance/quest-editor-read-20261029.md
          test "$(git diff --cached --name-only | wc -l)" -eq 10
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Expose immutable editor choices and supported form projections while preserving document commands'
          git push origin "HEAD:refs/heads/$TARGET"
          git rev-parse HEAD > ../evidence/source-commit.txt
          git rev-parse HEAD^{tree} > ../evidence/source-tree.txt
      - name: Keep actual results, including any failure, separately from product code
        if: always()
        working-directory: tooling
        run: |
          mkdir -p .maintenance-evidence
          python3 - <<'PY'
          from pathlib import Path
          import json,os,xml.etree.ElementTree as E
          r={'base':'2aff776dc0112a36c65797dee7192a4a4d77f03e','full_ci_claimed':False,'production_accessed':False,'logs':{},'suites':[]}
          for p in Path('../evidence').glob('*'):
              if p.suffix=='.json':r[p.name]=json.loads(p.read_text())
              elif p.suffix in ('.log','.txt'):
                  lines=p.read_text(errors='replace').splitlines();r['logs'][p.name]={'tail':lines[-70:],'errors':[s for s in lines if '[ERROR]' in s][-30:]}
          for p in Path('../candidate/target/surefire-reports').glob('TEST-*QuestEditorRead*.xml'):r['suites'].append(E.parse(p).getroot().attrib)
          Path('.maintenance-evidence/editor-read-'+os.environ['GITHUB_RUN_ID']+'.json').write_text(json.dumps(r,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .maintenance-evidence/editor-read-*.json
          git commit -m 'Keep corrected fixture editor read outcome; preserve earlier failed preparation'
          git push origin HEAD:refs/heads/maintenance/quest-editor-read-worker-20261029
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: quest-editor-read-v2-evidence
          path: |
            evidence/
            candidate/target/surefire-reports/
          retention-days: 14
